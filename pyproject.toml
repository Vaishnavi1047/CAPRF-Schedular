[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "caprf"
version = "1.0.0"
description = "CAPRF++: context-aware B+-tree scheduler with weighted multi-objective PPO and predictive prewarming"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
include = ["caprf*"]
